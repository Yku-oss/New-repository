server:
  port: 8081

spring:
  application:
    name: seckill
  datasource:
    url: jdbc:mysql://localhost:3307/seckill?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: localhost
      port: 6379
      database: 0
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
    connection-timeout: 1s
    publisher-confirm-type: correlated
    publisher-returns: true
    listener:
      simple:
        prefetch: 1
        acknowledge-mode: auto
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 1000
          multiplier: 2
          max-interval: 10000
    template:
      retry:
        enabled: true
        multiplier: 2

mybatis:
  configuration:
    map-underscore-to-camel-case: true
logging:
  level:
    com.example.seckill.mapper: debug
seckill:
  mq:
    fail-test: false    # 打开：消费者故意抛异常（验证死信）；关闭：正常
  limit:
    capacity: 10        # 令牌桶容量（压测时可临时调大，如 100000）
    rate: 5             # 令牌补充速率（个/秒）
