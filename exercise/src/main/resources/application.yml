# ==================== 数据库配置 ====================
spring:
  datasource:
    url: jdbc:mysql://localhost:3306/short_url?useSSL=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
  # ==================== Redis 配置 ====================
  data:
    redis:
      host: localhost
      port: 6379
      # password:        # Memurai 开发版默认无密码，如有密码取消注释
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
          max-wait: -1ms

# ==================== MyBatis-Plus 配置 ====================
mybatis-plus:
  # mapper XML 文件位置， XML也就是配置文件
  mapper-locations: classpath:mapper/*.xml
  # 实体类包路径（XML 中 resultType 可以简写类名），aliases--实体
  type-aliases-package: com.demo.entity
  configuration:
    # 下划线转驼峰：数据库字段 user_name → Java 属性 userName
    map-underscore-to-camel-case: true
    # 控制台打印 SQL（开发时打开，上线关闭）
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
               
# ==================== 服务器端口 ====================
server:
  port: 8080
